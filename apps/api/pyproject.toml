[project]
name = "kreo-api"
version = "0.1.0"
description = "KREO — API REST (Django + DRF), monolithe modulaire"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "T20"]
ignore = ["B904", "DJ001", "DJ008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["kreo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kreo.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
