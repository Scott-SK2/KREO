name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kreo
          POSTGRES_PASSWORD: kreo
          POSTGRES_DB: kreo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kreo -d kreo"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: kreo.settings.test
      DATABASE_URL: postgres://kreo:kreo@localhost:5432/kreo
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations rejouables à vide
        run: python manage.py migrate --noinput
      - name: Tests
        run: pytest -q
      - name: Schéma OpenAPI à jour dans packages/api-client
        run: |
          python manage.py spectacular --format openapi-json --file /tmp/openapi.json --validate
          diff -q /tmp/openapi.json ../../packages/api-client/openapi.json \
            || (echo "::error::Le contrat OpenAPI a changé : régénère packages/api-client/openapi.json (pnpm api:openapi)." && exit 1)

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  deploy-staging:
    name: Déploiement staging
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Déployer
        # À brancher sur l'hébergeur choisi en sprint 0 (voir docs/adr/0005-hebergement.md).
        # Les secrets (STAGING_DEPLOY_TOKEN, etc.) vivent dans GitHub Environments, jamais dans le dépôt.
        run: 'echo "Déploiement staging — hook à configurer (ADR 0005)."'
